name: Bootstrap ProjectTaxila repository

on:
  push:
    paths:
      - ".bootstrap/**"
      - ".github/workflows/bootstrap.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out bootstrap commit
        uses: actions/checkout@v4

      - name: Reassemble and verify repository checkpoint
        shell: bash
        run: |
          cat .bootstrap/ProjectTaxila_GitHub_Ready.zip.part-* > /tmp/ProjectTaxila_GitHub_Ready.zip
          echo "27df881c911f17faa04345068cb5e674099efae93a12446c9aad708407d8ed05  /tmp/ProjectTaxila_GitHub_Ready.zip" | sha256sum -c -
          mkdir -p /tmp/projecttaxila
          unzip -q /tmp/ProjectTaxila_GitHub_Ready.zip -d /tmp/projecttaxila

      - name: Publish the complete research tree
        shell: bash
        run: |
          cp -a /tmp/projecttaxila/ProjectTaxila/. ./
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish complete ProjectTaxila research repository"
          git push
