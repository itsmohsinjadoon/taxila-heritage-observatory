name: Repository validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate structure, syntax, data formats, and secrets
        run: python scripts/validate_repository.py

  scientific-evidence:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-audit.txt
      - name: Install scientific audit environment
        run: python -m pip install -r requirements-audit.txt
      - name: Validate checksums, grains, coverage, keys, partitions, and raster alignment
        run: python scripts/audit_scientific_data.py --output scientific-data-quality-report.json --quiet
      - name: Upload data-quality evidence
        uses: actions/upload-artifact@v6
        with:
          name: ProjectTaxila-data-quality-report
          path: scientific-data-quality-report.json
          retention-days: 30
          if-no-files-found: error
